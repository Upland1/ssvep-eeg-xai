project:
  name: "ssvep-eeg-xai"
  description: "SSVEP classification and Explainable AI pipeline on binary EBR EEG data"
  target_conditions:
    - 201  # Fixation cross / Rest baseline
    - 202  # Cue / Lookback window
    - 101  # Stimulus target 1
    - 102  # Stimulus target 2
    - 103  # Stimulus target 3
    - 104  # Stimulus target 4
    - 105  # Stimulus target 5
 
paths:
  data_raw_dir: "data/raw"
  data_processed_dir: "data/processed"
  figures_dir: "outputs/figures"
  reports_dir: "outputs/reports"
  saved_models_dir: "outputs/saved_models"
 
channels:
  # All 8 recorded scalp/occipital channels are kept here. No channel is
  # excluded at this stage -- PO7 used to be hard-excluded before any
  # artifact-quality check ever ran. Now every channel flows into
  # X_time_windows.npy, and the two-tier quality pipeline
  # (quality_check.apply_artifact_quality_pipeline) decides -- per
  # subject, based on actual signal quality -- whether PO7 (or any other
  # channel) gets dropped.
  scalp:
    - "PO7"
    - "PO3"
    - "POz"
    - "PO4"
    - "PO8"
    - "O1"
    - "Oz"
    - "O2"
  excluded: []
  mark_channel: "MARK"
  auxiliary:
    - "TIMESTAMP"
    - "FLASHINGTIME"
 
preprocessing:
  lowcut_hz: 1.0
  highcut_hz: 60.0
  filter_order: 4
  sub_window_sec: 1.0
  vpp_thresh_uv: 200.0
  std_range: [0.5, 60.0]
  baseline:
    cross_condition: 201
    cue_condition: 202
    stimulus_duration_sec: 5.0
    pre_stim_cross_sec: 2.0
    cue_lookback_sec: 1.0
 
features:
  psd_range_hz: [5.0, 35.0]
  plotting_range_hz: [1.0, 60.0]
 
training:
  cv_splits: 5
  random_state: 42
  batch_size: 16
  learning_rate: 0.001
  epochs: 100