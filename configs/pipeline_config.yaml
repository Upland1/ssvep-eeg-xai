project:
  name: "ssvep-eeg-xai"
  description: "SSVEP classification and Explainable AI pipeline on binary EBR EEG data"
  target_conditions:
    - 201  # Rest baseline
    - 202  # Cue window
    - 101  # Target 1
    - 102  # Target 2
    - 103  # Target 3
    - 104  # Target 4
    - 105  # Target 5

paths:
  data_raw_dir: "data/raw"
  data_processed_dir: "data/processed"
  figures_dir: "outputs/figures"
  reports_dir: "outputs/reports"
  saved_models_dir: "outputs/saved_models"

channels:
  # Keep all recorded channels; quality checks decide what to drop.
  scalp:
    - "PO7"
    - "PO3"
    - "POz"
    - "PO4"
    - "PO8"
    - "O1"
    - "Oz"
    - "O2"
  excluded: []
  mark_channel: "MARK"
  auxiliary:
    - "TIMESTAMP"
    - "FLASHINGTIME"

preprocessing:
  lowcut_hz: 1.0
  highcut_hz: 90.0     # Keep harmonics up to 72 Hz
  notch_hz: 60.0       # Remove mains noise
  notch_q: 30.0
  filter_order: 4
  sub_window_sec: 1.0
  vpp_thresh_uv: 200.0
  std_range: [0.5, 60.0]
  baseline:
    cross_condition: 201
    cue_condition: 202
    stimulus_duration_sec: 5.0
    pre_stim_cross_sec: 2.0
    cue_lookback_sec: 1.0

# Shared subject-level quality decision.
quality:
  vpp_range_uv: [5.0, 120.0]      # Vpp limits
  std_range_uv: [1.0, 35.0]
  channel_fail_fraction: 0.5      # Drop channels failing in > 50% of windows
  artifact_block_sec: 0.25        # Artifact scan block size
  guard_sec: auto                 # Use the slowest filter's ringing time
  guard_rel_amplitude: 0.01       # Ringing cutoff

# Optional narrow filter-bank bands.
filter_bank:
  harmonics:
    enabled: true
    n_harmonics: 3          # Harmonics 1-3
    half_width_hz: 1.0
    order: 2
  intermediate:
    enabled: true           # Between-frequency bands
    half_width_hz: 1.0
    order: 2

features:
  psd_range_hz: [5.0, 35.0]
  plotting_range_hz: [1.0, 60.0]

training:
  cv_splits: 5
  random_state: 42
  batch_size: 16
  learning_rate: 0.001
  epochs: 100